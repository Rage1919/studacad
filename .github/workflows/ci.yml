name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Validate, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STUDACAD_ENV: test
      STUDACAD_APP_URL: https://studacad.test
      STUDACAD_RELEASE_SHA: ${{ github.sha }}
      SUPABASE_URL: https://example.supabase.co
      SUPABASE_PUBLISHABLE_KEY: test-publishable-key-000000000000
      SUPABASE_SECRET_KEY: test-secret-key-0000000000000000
      SUPABASE_PRIVATE_BUCKET: studacad-private
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/studacad_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: studacad_test
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d studacad_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate environment contract
        run: pnpm env:check && pnpm db:env:check

      - name: Smoke test migrations against empty PostgreSQL
        run: pnpm db:migrate && pnpm db:migrate

      - name: Type check
        run: pnpm typecheck

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Test
        run: pnpm test

      - name: Validate release-readiness evidence contract
        run: pnpm readiness:check

      - name: Build server deployment artifact
        run: pnpm build

      - name: Install Chromium for browser checks
        run: pnpm exec playwright install --with-deps chromium

      - name: Browser security and sign-in checks
        run: pnpm test:e2e

      - name: Audit production dependencies
        run: pnpm security:dependencies
