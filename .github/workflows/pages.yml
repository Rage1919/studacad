name: Deploy static preview to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Exclude server-only API routes
        run: mv app/api ../studacad-api-routes && mv app/auth ../studacad-auth-routes && mv proxy.ts ../studacad-proxy.ts

      - name: Build static preview
        run: pnpm exec next build
        env:
          PAGES_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          STUDACAD_ENV: preview
          STUDACAD_APP_URL: ${{ steps.pages.outputs.origin }}${{ steps.pages.outputs.base_path }}
          STUDACAD_RELEASE_SHA: ${{ github.sha }}
          NEXT_PUBLIC_STUDACAD_STATIC_PREVIEW: true

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
